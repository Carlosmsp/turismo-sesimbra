<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades em Sesimbra</title>
    <link rel="stylesheet" href="assets/styles-final.css">

</head>

<body>

<header>
    <h1>Atividades em Sesimbra</h1>
    <p>Descubra tudo o que pode fazer em Sesimbra e arredores.</p>
    <button id="darkModeBotao">⏾</button>
</header>
<nav id="navLinks"></nav>

<main>
    <div class="atividades-filtros">
        <div class="filtro-pesquisa">
            <input type="text" id="inputActividadesFiltro" placeholder="Pesquisar atividades..." aria-label="Pesquisar atividades">
        </div>
        <div class="filtro-categorias">
            <button type="button" class="btn-categoria ativo" data-categoria="todos" aria-pressed="true">Todos</button>
            <button type="button" class="btn-categoria" data-categoria="agua" aria-pressed="false">Água</button>
            <button type="button" class="btn-categoria" data-categoria="natureza" aria-pressed="false">Natureza</button>
            <button type="button" class="btn-categoria" data-categoria="aventura" aria-pressed="false">Aventura</button>
            <button type="button" class="btn-categoria" data-categoria="cultura" aria-pressed="false">Cultura</button>
        </div>
        <p class="filtro-resultado" id="actividadesResultado"></p>
    </div>
    <div class="card" id="actividadeCard"></div>
</main>
<script src="assets/script.js?v=qa-final-20260531"></script>

<footer>

</footer>

</body>
</html>
